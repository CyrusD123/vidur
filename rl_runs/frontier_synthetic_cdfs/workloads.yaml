checkpoint: rl_runs/frontier_synthetic/best.pt
seeds:
- 1000000
- 1000001
- 1000002
- 1000003
- 1000004
backend: frontier
policies:
- fcfs
- sjf_prefill_tokens_age200
- sjf_prefill_tokens
- policy_rank
workloads:
- name: tracelab_q1
  trace: tracelab
  arrivals: sessions
  qps: 1
  num_requests: 150
  num_blocks: 28318
  simulation: &id001
    max_tokens: 131072
  backend: frontier
  frontier: &id002
    model: llama3.1-8b
    device: a100
    network_device: a100_dgx
    model_cpu_overhead: false
    prediction_rounding_bits: 5
    enable_prefix_caching: true
    extra_args:
    - --vllm_v1_scheduler_config_max_model_len
    - '131072'
    - --random_forrest_execution_time_predictor_config_prediction_max_batch_size
    - '256'
- name: tracelab_q2
  trace: tracelab
  arrivals: sessions
  qps: 2
  num_requests: 150
  num_blocks: 28318
  simulation: *id001
  backend: frontier
  frontier: *id002
- name: freeinference_q1
  trace: freeinference
  arrivals: sessions
  qps: 1
  num_requests: 150
  num_blocks: 28318
  simulation: *id001
  backend: frontier
  frontier: *id002
- name: freeinference_q2
  trace: freeinference
  arrivals: sessions
  qps: 2
  num_requests: 150
  num_blocks: 28318
  simulation: *id001
  backend: frontier
  frontier: *id002
